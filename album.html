<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum - Ángel & Silvia</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
#visor{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.92);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    z-index:999;
}

.oculto{
    display:none !important;
}

#imagenGrande{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
    box-shadow:0 0 30px rgba(255,255,255,.2);
}

#cerrar{
    position:absolute;
    top:25px;
    right:35px;
    font-size:45px;
    color:white;
    cursor:pointer;
    user-select:none;
}
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f6f6f2;
        }

        h1{
            text-align:center;
            color:#566b5f;
            margin:30px 0;
        }

       #galeria{
    display:grid;
    gap:10px;
    padding:10px;
    grid-template-columns:repeat(4,1fr);
}

/* Tablets */
@media (min-width:768px){
    #galeria{
        grid-template-columns:repeat(6,1fr);
    }
}

/* Ordenadores */
@media (min-width:1200px){
    #galeria{
        grid-template-columns:repeat(8,1fr);
    }
}

        #galeria a{
            display:block;
        }

       #galeria img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

        #galeria img:hover{
            transform:scale(1.03);
        }
#acciones{
    position:static;
    transform:none;
}

#descargar{
    display:inline-block;
    background:#566b5f;
    color:white;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}

#descargar:hover{
    background:#435348;
}
   #contador{
    text-align:center;
    color:#566b5f;
    font-size:18px;
    margin-top:-15px;
    margin-bottom:20px;
    font-weight:bold;
}
        #modoSeleccion{

display:block;

margin:20px auto;

background:#566b5f;

color:white;

border:none;

padding:12px 24px;

border-radius:25px;

font-size:16px;

cursor:pointer;

}

#modoSeleccion:hover{

background:#435348;

}
        .foto{

    position:relative;

}

.marca{

    position:absolute;

    top:8px;

    right:8px;

    width:28px;

    height:28px;

    background:white;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;

    font-weight:bold;

    box-shadow:0 0 8px rgba(0,0,0,.3);

}
        .seleccionada{

    background:#566b5f;

    color:white;

}
    </style>

</head>

<body>

<h1>📷 Álbum de la boda</h1>

<p id="contador">...</p>

<button id="modoSeleccion">
    ☑ Seleccionar fotos
</button>

<div id="galeria"></div>

<div id="visor" class="oculto">

    <span id="cerrar">✕</span>

    <img id="imagenGrande">

    <button id="descargar">⬇ Descargar</button>

</div>

<script src="album.js"></script>

</body>
</html>
